[package]
name = "cli"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
quick-xml = { version = "0.41.0", features = ["serialize"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_json_path = "0.7.2"
chrono = "0.4.45"
regex = "1.12.4"

[dev-dependencies]
assert-json-diff = "2.0.2"
parameterized = "2.1.0"
tempfile = "3.27.0"
