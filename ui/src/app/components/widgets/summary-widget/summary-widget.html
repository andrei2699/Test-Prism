<mat-card [class.clickable]="link()" (click)="navigate()">
  <mat-card-header>
    <mat-card-title>{{ title() }}</mat-card-title>
    @if (timestamp()) {
      <mat-card-subtitle>{{ timestamp() | date: 'medium' }}</mat-card-subtitle>
    }
  </mat-card-header>
  <mat-card-content>
    @if (displayType() === 'pie') {
      <div class="pie-container" [style.justify-content]="justifyContent()" [ngStyle]="styles()">
        <app-test-distribution-pie
          [colors]="colors()"
          [tests]="tests()"
          [strategy]="pieStrategy()"
          [legend]="pieLegend()"
          [dataset]="pieDataset()"
          [options]="pieOptions()"
          [shouldDisplayInnerPercentage]="pieShouldDisplayInnerPercentage()"
          [width]="width()"
          [height]="height()" />
      </div>
    } @else {
      <div [style.display]="'flex'" [style.justify-content]="justifyContent()" [ngStyle]="styles()">
        <mat-chip-listbox>
          <mat-chip-option [selectable]="false" [style.background-color]="'#e0e0e0'"
            >Total: {{ summary().total }}
          </mat-chip-option>
          <mat-chip-option [selectable]="false" [style.background-color]="colors().PASSED">
            Passed: {{ summary().passed }}
          </mat-chip-option>
          <mat-chip-option [selectable]="false" [style.background-color]="colors().FAILED">
            Failed: {{ summary().failed }}
          </mat-chip-option>
          <mat-chip-option [selectable]="false" [style.background-color]="colors().SKIPPED"
            >Skipped: {{ summary().skipped }}
          </mat-chip-option>
          <mat-chip-option [selectable]="false" [style.background-color]="colors().ERROR"
            >Error: {{ summary().error }}
          </mat-chip-option>
        </mat-chip-listbox>
      </div>
    }
  </mat-card-content>
</mat-card>
